name: Test Solana Install Action

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Solana version to test'
        required: true
        default: '1.17.10'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana
        uses: ./install-solana
        with:
          version: '1.17.10'
          cache: true

      - name: Test Solana Installation
        run: |
          solana --version
          solana-keygen --version
          solana-validator --version